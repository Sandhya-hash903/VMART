<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Wishlist | V MART</title>

    <!-- Customer CSS -->
    <link
        rel="stylesheet"
        href="../css/customer.css"
    >

    <!-- Wishlist CSS -->
    <link
        rel="stylesheet"
        href="../css/wishlist.css"
    >

</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="wishlist-header">

        <div class="wishlist-header-left">

            <a
                href="index.html"
                class="back-btn"
                aria-label="Go back"
            >
                ←
            </a>

            <h2>My Wishlist</h2>

        </div>

        <a
            href="index.html"
            class="home-btn"
        >
            Home
        </a>

    </header>


    <!-- =====================================================
         WISHLIST CONTENT
    ====================================================== -->

    <main class="wishlist-container">

        <div
            id="wishlist"
            class="wishlist-grid"
        >
            <!-- Wishlist products are loaded by wishlist.js -->
        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="../js/customer.js"></script>

    <script src="../js/wishlist.js"></script>

</body>

</html>
