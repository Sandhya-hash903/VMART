<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>My Returns | V Mart</title>

    <link
        rel="stylesheet"
        href="../css/customer.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            background: #111;
            color: #fff;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        header h2 {
            margin: 0;
        }

        header a {
            color: #fff;
            text-decoration: none;
            background: #e91e63;
            padding: 10px 18px;
            border-radius: 6px;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .page-title {
            margin-bottom: 20px;
        }

        .return-card {
            background: #fff;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }

        .return-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 18px;
        }

        .return-header h3 {
            margin: 0 0 8px;
        }

        .return-header p {
            margin: 5px 0;
            color: #666;
        }

        .status {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-requested {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .status-picked {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-received {
            background: #cce5ff;
            color: #004085;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #eee;
            color: #555;
        }

        .items {
            display: grid;
            gap: 12px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: #fafafa;
            border-radius: 8px;
        }

        .item img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
        }

        .item-details {
            flex: 1;
        }

        .item-details strong {
            display: block;
            margin-bottom: 5px;
        }

        .item-details p {
            margin: 4px 0;
            color: #666;
        }

        .return-details {
            margin-top: 18px;
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .detail-box {
            background: #fafafa;
            padding: 14px;
            border-radius: 8px;
        }

        .detail-box strong {
            display: block;
            margin-bottom: 5px;
        }

        .no-returns {
            background: #fff;
            padding: 45px 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }

        .no-returns a {
            display: inline-block;
            margin-top: 15px;
            background: #e91e63;
            color: #fff;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 6px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 18px;
            border-radius: 8px;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            header h2 {
                font-size: 20px;
            }

            main {
                margin: 20px auto;
            }

            .return-header {
                flex-direction: column;
            }

            .return-details {
                grid-template-columns: 1fr;
            }

            .item img {
                width: 60px;
                height: 60px;
            }

        }

    </style>

</head>

<body>

<header>

    <h2>My Returns</h2>

    <a href="orders.html">
        My Orders
    </a>

</header>

<main>

    <h2 class="page-title">
        Return History
    </h2>

    <div id="returns">

        <p>
            Loading returns...
        </p>

    </div>

</main>

<script src="../js/customer.js"></script>
<script src="../js/returns.js"></script>

</body>

</html>
