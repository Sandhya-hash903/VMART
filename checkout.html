<!-- =========================================================
     CHECKOUT
========================================================= -->

<main class="checkout-container">

    <h1>
        Checkout
    </h1>


    <!-- =====================================================
         DELIVERY ADDRESS
    ====================================================== -->

    <section class="checkout-section delivery-address-section">

        <h2>
            Delivery Address
        </h2>


        <!-- SAVED ADDRESSES -->

        <div
            id="addressList"
            class="address-list">

            Loading addresses...

        </div>


        <!-- ADD NEW ADDRESS -->

        <button
            type="button"
            id="showAddressFormBtn"
            class="add-new-address-btn">

            ＋ Add New Address

        </button>


        <!-- =================================================
             ADDRESS FORM
        ================================================== -->

        <div
            id="addressFormContainer"
            class="address-form"
            style="display:none;">

            <h3 id="addressFormTitle">
                Add New Address
            </h3>


            <form id="addressForm">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="addressName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="addressName"
                        placeholder="Enter Full Name"
                        required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="addressPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="addressPhone"
                        placeholder="Enter Phone Number"
                        required>

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter Full Address"
                        required></textarea>

                </div>


                <!-- CITY / STATE / PINCODE -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="City"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="state">
                            State
                        </label>

                        <input
                            type="text"
                            id="state"
                            placeholder="State"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="pincode">
                            Pincode
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            placeholder="Pincode"
                            required>

                    </div>


                </div>


                <!-- FORM BUTTONS -->

                <div class="address-form-buttons">

                    <button
                        type="submit"
                        id="saveAddressBtn">

                        Save Address

                    </button>


                    <button
                        type="button"
                        id="cancelAddressBtn">

                        Cancel

                    </button>

                </div>


            </form>

        </div>

    </section>


    <!-- =====================================================
         PAYMENT
    ====================================================== -->

    <section class="checkout-section">

        <h2>
            Payment
        </h2>


        <!-- COD -->

        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="COD"
                checked>

            <span>
                Cash on Delivery
            </span>

        </label>


        <!-- ONLINE -->

        <!---<label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="ONLINE">

            <span>
                Online Payment
            </span>

        </label>---->


        <!-- ONLINE PAYMENT -->

        <!---<div
            id="onlinePaymentBox"
            class="online-payment-box"
            style="display:none;">

            <p>
                Pay securely using UPI, Card,
                Net Banking or available payment
                methods.
            </p>


            <button
                id="onlinePayBtn"
                type="button">

                💳 Pay Online

            </button>

        </div>---->


        <!-- PLACE ORDER -->

        <button
            id="placeOrderBtn"
            class="place-order-btn"
            type="button">

            Place Order

        </button>


        <p id="paymentMessage"></p>

    </section>


    <!-- =====================================================
         ORDER SUMMARY
    ====================================================== -->

    <section class="checkout-section">

        <h2>
            Order Summary
        </h2>


        <div id="orderSummary">

            Loading...

        </div>


        <h2 class="checkout-total">

            Total:

            <span id="checkoutTotal">
                ₹0
            </span>

        </h2>

    </section>
